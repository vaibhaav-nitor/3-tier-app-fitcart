name: Backend — Build & Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "helm/backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repository variables, taken from `terraform output workflow_env`.
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
  IMAGE_NAME: fitcart-backend
  K8S_NAMESPACE: fitcart
  HELM_RELEASE: fitcart-backend

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # azure/login takes the service principal as a JSON blob, assembled here
      # from the four discrete repository secrets.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      # Exchanges the service principal token for an ACR refresh token and writes
      # it into the Docker config, so no admin credentials are needed.
      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: HIGH,CRITICAL
          # Report-only: a test app should not be blocked by base-image CVEs.
          exit-code: "0"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          # Without this, `mvn dependency:go-offline` in backend/Dockerfile
          # re-downloads the entire dependency tree on every single run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "0"

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build

    # One backend rollout at a time. Literal string: the `env` context is not
    # available in `concurrency`.
    concurrency:
      group: deploy-backend-fitcart
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # azure/login takes the service principal as a JSON blob, assembled here
      # from the four discrete repository secrets.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      # Masks are registered BEFORE the values are used anywhere, so a failing
      # helm command cannot echo the password into the log.
      - name: Read database credentials from Key Vault
        run: |
          set -euo pipefail
          db_user=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-user --query value -o tsv)
          db_password=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-password --query value -o tsv)
          echo "::add-mask::$db_user"
          echo "::add-mask::$db_password"
          echo "DB_USER=$db_user" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint ./helm/backend \
            --set db.user=placeholder \
            --set db.password=placeholder

      - name: Helm upgrade
        run: |
          helm upgrade --install "$HELM_RELEASE" ./helm/backend \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set image.repository="${ACR_LOGIN_SERVER}/${IMAGE_NAME}" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set db.user="$DB_USER" \
            --set db.password="$DB_PASSWORD"

      - name: Rollout summary
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo ""
            echo "Image tag: \`${{ needs.build.outputs.image_tag }}\`"
            echo ""
            echo '```'
            kubectl get pods -n "$K8S_NAMESPACE" -l app=backend -o wide || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
