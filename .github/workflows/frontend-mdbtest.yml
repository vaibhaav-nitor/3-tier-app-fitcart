name: "[mdbtest] Frontend — Build & Deploy"

# A copy of frontend-ci-cd.yml pointed at the mdbtest environment. Kept separate
# rather than parameterising the original, so the workflow currently deploying
# the live application stays byte-identical.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.MDBTEST_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.MDBTEST_ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ vars.MDBTEST_AKS_CLUSTER_NAME }}
  KEY_VAULT_NAME: ${{ vars.MDBTEST_KEY_VAULT_NAME }}

  # The resource group is shared with dev, so this one is not prefixed.
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

  IMAGE_NAME: fitcart-frontend
  K8S_NAMESPACE: fitcart-mdbtest
  HELM_RELEASE: mdbtest-frontend

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to mdbtest AKS
    runs-on: ubuntu-latest
    needs: build

    concurrency:
      group: deploy-frontend-mdbtest
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Read frontend runtime config from Key Vault
        run: |
          set -euo pipefail
          hero_highlight_text=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name version-v1 \
            --query value -o tsv 2>/dev/null || true)

          if [ -z "$hero_highlight_text" ]; then
            hero_highlight_text="Progress."
            echo "Key Vault secret version-v1 not found. Using default frontend hero text."
          fi

          echo "HERO_HIGHLIGHT_TEXT=$hero_highlight_text" >> "$GITHUB_ENV"

      - name: Configure image pull secret
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          admin=$(az acr show --name "$ACR_NAME" --query adminUserEnabled -o tsv)
          if [ "$admin" = "true" ]; then
            user=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
            pass=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
            echo "::add-mask::$pass"
            kubectl create secret docker-registry acr-pull-secret \
              --docker-server="$ACR_LOGIN_SERVER" \
              --docker-username="$user" \
              --docker-password="$pass" \
              --namespace "$K8S_NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "IMAGE_PULL_SECRET=acr-pull-secret" >> "$GITHUB_ENV"
            echo "Using imagePullSecret (ACR admin enabled)."
          else
            echo "IMAGE_PULL_SECRET=" >> "$GITHUB_ENV"
            echo "Pulling via the kubelet identity's AcrPull role assignment."
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install "$HELM_RELEASE" ./helm/frontend \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set image.repository="${ACR_LOGIN_SERVER}/${IMAGE_NAME}" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set imagePullSecret="$IMAGE_PULL_SECRET" \
            --set runtimeConfig.heroHighlightText="$HERO_HIGHLIGHT_TEXT"

      - name: Report application URL
        if: always()
        run: |
          ip=$(kubectl get svc frontend -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          for _ in $(seq 1 12); do
            [ -n "$ip" ] && break
            sleep 10
            ip=$(kubectl get svc frontend -n "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          done
          {
            echo "### Frontend deploy — mdbtest"
            echo ""
            echo "Image tag: \`${{ needs.build.outputs.image_tag }}\`"
            echo ""
            if [ -n "$ip" ]; then
              echo "Application URL: http://$ip"
            else
              echo "LoadBalancer IP not assigned yet — check \`kubectl get svc frontend -n $K8S_NAMESPACE\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
