name: "[mdbtest] Backend — Build & Deploy"

# A copy of backend-ci-cd.yml pointed at the mdbtest environment. Kept separate
# rather than parameterising the original, so the workflow currently deploying
# the live application stays byte-identical.
#
# Manual dispatch only. No push trigger — a commit touching backend/** should
# deploy to dev via backend-ci-cd.yml, not silently to this test stack too.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # MDBTEST_-prefixed repository variables, from `terraform output workflow_env`
  # in terraform/envs/mdbtest. Distinct from the unprefixed ones the dev
  # workflows read, so the two environments can never cross-target.
  ACR_NAME: ${{ vars.MDBTEST_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.MDBTEST_ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ vars.MDBTEST_AKS_CLUSTER_NAME }}
  KEY_VAULT_NAME: ${{ vars.MDBTEST_KEY_VAULT_NAME }}
  POSTGRES_HOST: ${{ vars.MDBTEST_POSTGRES_HOST }}

  # The resource group is shared with dev, so this one is not prefixed.
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

  IMAGE_NAME: fitcart-backend
  K8S_NAMESPACE: fitcart-mdbtest
  HELM_RELEASE: mdbtest-backend

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to mdbtest AKS
    runs-on: ubuntu-latest
    needs: build

    concurrency:
      group: deploy-backend-mdbtest
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      # Masks are registered BEFORE the values are used anywhere, so a failing
      # helm command cannot echo the password into the log.
      - name: Read database credentials from Key Vault
        run: |
          set -euo pipefail
          db_user=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-user --query value -o tsv)
          db_password=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-password --query value -o tsv)
          echo "::add-mask::$db_user"
          echo "::add-mask::$db_password"
          echo "DB_USER=$db_user" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"

      - name: Configure image pull secret
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          admin=$(az acr show --name "$ACR_NAME" --query adminUserEnabled -o tsv)
          if [ "$admin" = "true" ]; then
            user=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
            pass=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
            echo "::add-mask::$pass"
            kubectl create secret docker-registry acr-pull-secret \
              --docker-server="$ACR_LOGIN_SERVER" \
              --docker-username="$user" \
              --docker-password="$pass" \
              --namespace "$K8S_NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "IMAGE_PULL_SECRET=acr-pull-secret" >> "$GITHUB_ENV"
            echo "Using imagePullSecret (ACR admin enabled)."
          else
            echo "IMAGE_PULL_SECRET=" >> "$GITHUB_ENV"
            echo "Pulling via the kubelet identity's AcrPull role assignment."
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install "$HELM_RELEASE" ./helm/backend \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set image.repository="${ACR_LOGIN_SERVER}/${IMAGE_NAME}" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set imagePullSecret="$IMAGE_PULL_SECRET" \
            --set db.host="$POSTGRES_HOST" \
            --set db.user="$DB_USER" \
            --set db.password="$DB_PASSWORD"

      - name: Rollout summary
        if: always()
        run: |
          {
            echo "### Backend deploy — mdbtest"
            echo ""
            echo "Image tag: \`${{ needs.build.outputs.image_tag }}\`"
            echo ""
            echo '```'
            kubectl get pods -n "$K8S_NAMESPACE" -l app=backend -o wide || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
