name: "[appservice] Terraform — App Service Infrastructure"

# Separate from terraform.yml and terraform-mdbtest.yml on purpose. This one
# drives a completely independent state file (appservice.terraform.tfstate) in
# the same storage account, so an apply here cannot affect the AKS
# environments' resources, and nothing there can affect this one.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
  pull_request:
    paths:
      - "terraform/modules/app-service/**"
      - "terraform/modules/postgresql/**"
      - "terraform/envs/appservice/**"
      - ".github/workflows/terraform-appservice.yml"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VAR_FILE: appservice.tfvars

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'plan' || inputs.action }}
    runs-on: ubuntu-latest

    # Its own concurrency group, independent of terraform.yml's and
    # terraform-mdbtest.yml's — the three environments hold different state
    # blobs and never contend.
    concurrency:
      group: terraform-appservice
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/envs/appservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No azure/login step here: this workflow never invokes the az CLI, and
      # Terraform authenticates to Azure with the ARM_* variables above.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: true

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: inputs.action != 'destroy'
        id: plan
        run: terraform plan -input=false -no-color -var-file="$TF_VAR_FILE" -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan (\`appservice\`)\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -var-file="$TF_VAR_FILE"

      # These are the values to publish as APPSERVICE_* repository variables.
      - name: Show outputs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: |
          {
            echo "### Terraform outputs — appservice"
            echo ""
            echo "Publish these as GitHub repository **variables**:"
            echo ""
            echo '```json'
            terraform output -json workflow_env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
