apiVersion: v1
kind: Service
metadata:
  # Fixed name, NOT derived from the release name: the backend's FRONTEND_ORIGIN
  # CORS setting is http://frontend:80.
  name: {{ .Values.serviceName }}
  labels:
    app: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
