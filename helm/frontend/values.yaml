replicaCount: 1

image:
  repository: acrfitcartdevnmv9l9.azurecr.io/fitcart-frontend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecret: "acr-pull-secret"

serviceName: frontend

service:
  type: LoadBalancer
  port: 80

containerPort: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
