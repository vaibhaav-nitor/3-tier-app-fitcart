replicaCount: 1

image:
  # Overwritten at deploy time with the ACR login server, e.g.
  # acrfitcartdev123456.azurecr.io/fitcart-frontend
  repository: fitcart-frontend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecret: "acr-pull-secret"

serviceName: frontend

service:
  type: LoadBalancer
  port: 80

containerPort: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
