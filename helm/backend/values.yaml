replicaCount: 1

image:
  # Overwritten at deploy time with the ACR login server, e.g.
  # acrfitcartdev123456.azurecr.io/fitcart-backend
  repository: fitcart-backend
  tag: latest
  pullPolicy: IfNotPresent

# Empty when the AKS kubelet identity holds AcrPull on the registry, which is the
# normal case and needs no credential in the cluster at all. Set to a
# docker-registry Secret name only where that role assignment could not be
# created; the deploy workflow creates the Secret and passes the name here.
imagePullSecret: ""

# Fixed Service name. frontend/nginx.conf proxies /api/ to http://backend:8080,
# so this must not be templated off the release name.
serviceName: backend

service:
  type: ClusterIP
  port: 8080

# Matches EXPOSE 8080 in backend/Dockerfile.
containerPort: 8080

db:
  # Service name published by the fitcart-database release.
  host: postgres
  port: 5432
  name: backenddb
  # Empty by design. Injected at deploy time from Azure Key Vault (secrets
  # `postgres-user` / `postgres-password`). Never commit real values here.
  user: ""
  password: ""

# Consumed by cors.allowed-origin in backend/src/main/resources/application.yml.
frontendOrigin: http://frontend:80

keyVault:
  # false: db.user/db.password below are used, filled in by the deploy workflow
  # from `az keyvault secret show` on every deploy. true: backend-secrets is
  # instead synced live by the AKS Key Vault CSI driver (enable_key_vault_csi
  # in terraform/modules/aks), and Reloader restarts the pod whenever the
  # vault value changes — no redeploy needed. Requires the CSI driver's
  # identity to already hold Key Vault Secrets User on the vault (see
  # create_key_vault_csi_role_assignment in terraform/envs/dev/variables.tf).
  enabled: false
  # Key Vault name, e.g. kv-fitcart-dev-xxxxxx (terraform output key_vault_name).
  name: ""
  # terraform output key_vault_tenant_id.
  tenantId: ""
  # terraform output key_vault_csi_identity_client_id.
  csiIdentityClientId: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
