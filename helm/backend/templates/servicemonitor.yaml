{{- if and .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Only rendered once kube-prometheus-stack's CRDs exist in the cluster (see
# monitoring/README.md) AND monitoring.enabled=true is set — so a plain
# `helm install` on a cluster without the stack still succeeds.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    app: backend
    # kube-prometheus-stack's default Prometheus only watches ServiceMonitors
    # carrying its own release label — see monitoring/values.yaml.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
