{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-kv-secrets
  labels:
    app: backend
spec:
  provider: azure
  # Syncs the mounted Key Vault objects into a real Secret so the pod can keep
  # consuming DB_USER/DB_PASSWORD via envFrom.secretRef, unchanged from the
  # static-Secret path. The CSI driver keeps this Secret's values current on
  # each rotation poll — see key_vault_csi_rotation_interval in the aks module.
  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - objectName: postgres-user
          key: DB_USER
        - objectName: postgres-password
          key: DB_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "keyVault.csiIdentityClientId is required when keyVault.enabled is true" .Values.keyVault.csiIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when keyVault.enabled is true" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required when keyVault.enabled is true" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
{{- end }}
