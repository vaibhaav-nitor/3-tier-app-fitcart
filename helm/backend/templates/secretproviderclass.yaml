{{- if and .Values.secretProviderClass.enabled (.Capabilities.APIVersions.Has "secrets-store.csi.x-k8s.io/v1") }}
# Only renders once both the value is set AND the Secrets Store CSI driver's
# CRD exists in the cluster (enable_key_vault_csi in terraform/modules/aks) —
# so a plain `helm install` on a cluster without the driver still succeeds.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-kv
  labels:
    app: backend
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "secretProviderClass.userAssignedIdentityID is required (Terraform output key_vault_csi_identity_client_id)" .Values.secretProviderClass.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "secretProviderClass.keyVaultName is required" .Values.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ required "secretProviderClass.tenantId is required" .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
{{- end }}
