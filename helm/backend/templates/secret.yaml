{{- if not .Values.keyVault.enabled }}
# Static path: CI reads Key Vault at deploy time and passes the values in via
# --set. Picking up a later change in the vault needs another deploy. When
# keyVault.enabled is true, secret-provider-class.yaml owns this Secret
# instead — synced directly from Key Vault by the CSI driver, no redeploy
# needed to pick up a changed value.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app: backend
type: Opaque
stringData:
  # Same Key Vault secrets the database release uses. If these two releases are
  # ever deployed with different values the backend fails JDBC authentication,
  # so both workflows read from the identical vault entries.
  DB_USER: {{ required "db.user is required (set from Key Vault secret postgres-user)" .Values.db.user | quote }}
  DB_PASSWORD: {{ required "db.password is required (set from Key Vault secret postgres-password)" .Values.db.password | quote }}
{{- end }}
