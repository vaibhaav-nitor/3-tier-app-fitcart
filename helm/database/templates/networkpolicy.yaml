{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  # Egress is listed with no rules on purpose: Postgres initiates no outbound
  # connections, so all of it is denied.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- end }}
