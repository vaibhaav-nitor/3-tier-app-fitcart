{{- if not .Values.keyVault.enabled }}
# Static path: CI reads Key Vault at deploy time and passes the values in via
# --set. When keyVault.enabled is true, secret-provider-class.yaml owns this
# Secret instead — synced directly from Key Vault by the CSI driver, so a
# changed vault value reaches the pod on the next rotation poll + Reloader
# restart, with no redeploy.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  # Sourced from Azure Key Vault by the deploy workflow and passed in with --set.
  # `required` makes a missing credential fail at template time instead of
  # silently creating a database with an empty password.
  POSTGRES_USER: {{ required "auth.username is required (set from Key Vault secret postgres-user)" .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "auth.password is required (set from Key Vault secret postgres-password)" .Values.auth.password | quote }}
{{- end }}
