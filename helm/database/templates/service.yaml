apiVersion: v1
kind: Service
metadata:
  # Fixed name, NOT derived from the release name: the backend connects to
  # DB_HOST=postgres. Renaming this breaks the backend's JDBC URL.
  name: {{ .Values.serviceName }}
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
