{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-kv-secrets
  labels:
    app: postgres
spec:
  provider: azure
  # Same two vault entries the backend release reads. Kept in its own Secret
  # (postgres-secret) so a divergence between the two releases is impossible —
  # both sync from the identical objects, on their own poll cycles.
  secretObjects:
    - secretName: postgres-secret
      type: Opaque
      data:
        - objectName: postgres-user
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "keyVault.csiIdentityClientId is required when keyVault.enabled is true" .Values.keyVault.csiIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when keyVault.enabled is true" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required when keyVault.enabled is true" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
{{- end }}
