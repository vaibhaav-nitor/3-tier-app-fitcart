apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # A single ReadWriteOnce managed disk cannot be attached to two nodes at once,
  # so the default rolling update would deadlock: the new pod waits for a volume
  # the old pod still holds. Recreate tears the old one down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        {{- if not .Values.keyVault.enabled }}
        # Static-secret path only: restarts the pod when the Secret rendered
        # from --set values changes. In CSI mode the Secret is updated
        # out-of-band by the driver, so Reloader (below) triggers the restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.keyVault.enabled }}
        # Reloader watches postgres-secret (referenced via secretKeyRef below)
        # and rolling-restarts this Deployment automatically when the CSI
        # driver updates it from a rotated Key Vault value.
        reloader.stakater.com/auto: "true"
        {{- end }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # The image initialises the cluster in a subdirectory of the mount so
            # the lost+found directory on the managed disk does not abort initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              # Wrapped in sh -c on purpose: Kubernetes expands $(VAR) in a
              # container's command and args, but NOT in a probe's exec command.
              # Without the shell, pg_isready would receive the literal string.
              command: ["sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.database.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            {{- if .Values.keyVault.enabled }}
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        {{- if .Values.keyVault.enabled }}
        # Unused by the app (it reads POSTGRES_USER/PASSWORD from
        # secretKeyRef). Mounting is only here because the CSI driver syncs
        # into secretObjects.secretName (postgres-secret) solely for volumes
        # it actually has mounted somewhere — the mount is what keeps the
        # rotation poll running against a live pod.
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postgres-kv-secrets
        {{- end }}
