image:
  repository: postgres
  tag: "14"
  pullPolicy: IfNotPresent

# Fixed Service name. The backend resolves the database via DB_HOST=postgres,
# so this must not be templated off the release name.
serviceName: postgres

database:
  name: backenddb
  port: 5432

# Empty by design. Both values are injected at deploy time from Azure Key Vault
# (secrets `postgres-user` and `postgres-password`). Never commit real values here.
auth:
  username: ""
  password: ""

storage:
  size: 5Gi
  # AKS built-in class, backed by a managed disk.
  storageClass: managed-csi

keyVault:
  # Same toggle and meaning as helm/backend/values.yaml's keyVault block —
  # keep both releases on the same setting, since they read identical vault
  # entries (postgres-user / postgres-password).
  enabled: false
  name: ""
  tenantId: ""
  csiIdentityClientId: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
