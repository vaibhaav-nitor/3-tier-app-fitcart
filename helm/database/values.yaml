image:
  repository: postgres
  tag: "14"
  pullPolicy: IfNotPresent

imagePullSecret: ""

# Fixed Service name. The backend resolves the database via DB_HOST=postgres,
# so this must not be templated off the release name.
serviceName: postgres

database:
  name: backenddb
  port: 5432

auth:
  username: "admin"
  password: "password@123"

storage:
  size: 5Gi
  # AKS built-in class, backed by a managed disk.
  storageClass: managed-csi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
