apiVersion: adaas.poc/v1
kind: ValidationSuite
metadata:
  name: fitcart-v2-smoke-tests
spec:
  checks:
    - id: frontend-service-ready
      type: kubernetes
      target: service/frontend
      expected: LoadBalancer service has an external IP or hostname.

    - id: backend-pods-ready
      type: kubernetes
      target: deployment/backend
      expected: 2 desired replicas and 2 ready replicas.

    - id: frontend-pods-ready
      type: kubernetes
      target: deployment/frontend
      expected: 2 desired replicas and 2 ready replicas.

    - id: postgres-ready
      type: kubernetes
      target: deployment/postgres
      expected: 1 desired replica and 1 ready replica.

    - id: backend-health
      type: http
      target: http://backend:8080/api/records
      expectedStatus: 200
      runFrom: in-cluster

    - id: frontend-health
      type: http
      target: http://frontend/
      expectedStatus: 200
      runFrom: in-cluster

    - id: db-schema
      type: sql
      target: backenddb
      query: |
        SELECT column_name
        FROM information_schema.columns
        WHERE table_name = 'gym_record'
          AND column_name IN (
            'photo_url',
            'fitness_level',
            'target_calories',
            'workout_goal',
            'audit_created_by',
            'audit_updated_by',
            'notification_enabled'
          );
      expectedRows: 7

    - id: notification-secrets
      type: secret-metadata
      target: Azure Key Vault
      expectedSecretNames:
        - smtp-username
        - smtp-password
        - storage-sas-token

    - id: audit-config
      type: kubernetes-config
      target: configmap/backend-config
      expectedValues:
        ENABLE_AUDIT: "true"
        NOTIFICATION_ENABLED: "true"
        EMAIL_PROVIDER: smtp
        PHOTO_STORAGE_CONTAINER: fitcart-member-photos
        MAX_UPLOAD_SIZE_MB: "5"
