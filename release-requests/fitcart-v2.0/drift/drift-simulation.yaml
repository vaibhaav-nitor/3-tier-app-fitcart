apiVersion: adaas.poc/v1
kind: DriftSimulation
metadata:
  name: fitcart-v2-audit-config-drift
spec:
  purpose: Demonstrate post-release configuration drift detection.
  baselineAfterRelease:
    configMap: backend-config
    expectedValues:
      ENABLE_AUDIT: "true"
      NOTIFICATION_ENABLED: "true"

  manualChange:
    actor: cluster-admin
    target: configmap/backend-config
    field: ENABLE_AUDIT
    from: "true"
    to: "false"

  expectedDetection:
    status: Configuration Drift Detected
    resource: configmap/backend-config
    field: ENABLE_AUDIT
    expected: "true"
    actual: "false"
    changedBy: cluster-admin
    risk: Low

  recommendedAction:
    title: Restore approved configuration
    action: Set ENABLE_AUDIT back to true and restart backend pods.
    humanApprovalRequired: true
